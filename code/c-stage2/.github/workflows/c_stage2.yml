name: c-stage2
concurrency:
  group: c-stage2
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [c-stage2]
    paths: ['phase_c2/**', '.github/workflows/c_stage2.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned HireMind-DL code and data loader
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git _dl && git -C _dl checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Install (CPU torch)
        run: |
          pip install pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 transformers==4.51.3 numpy scipy xgboost sentence-transformers==3.4.1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip freeze > pip_freeze.txt
      - name: Stage 2 (M3 XGBoost, M6 MiniLM)
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          python phase_c2/c_stage2_m3_m6.py _dl out 2>&1 | tail -25 | cut -c1-200 | tee out/run_log_tail.txt
      - name: Commit outputs (scores/IDs only)
        if: always()
        shell: bash
        run: |
          mkdir -p c2_results/run_${{ github.run_id }} && cp -r out/* pip_freeze.txt c2_results/run_${{ github.run_id }}/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b c-stage2-results-${{ github.run_id }}
          git add -f c2_results && git commit -qm "C stage 2 outputs ${{ github.run_id }} (no raw text)"
          git push origin c-stage2-results-${{ github.run_id }}
      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
