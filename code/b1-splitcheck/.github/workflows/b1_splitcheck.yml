name: b1-splitcheck
concurrency:
  group: b1-splitcheck
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [b1-splitcheck]
    paths: ['b1check/**', '.github/workflows/b1_splitcheck.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned HireMind-DL code and data loader
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git _dl && git -C _dl checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Install
        run: |
          pip install pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 transformers==4.51.3 numpy scipy
          pip freeze > pip_freeze.txt
      - name: Compare extractor vs splitter fix (counts only)
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          python b1check/b1_splitcheck.py _dl out 2>&1 | tail -30 | cut -c1-200 | tee out/run_log_tail.txt
      - name: Commit outputs
        if: always()
        shell: bash
        run: |
          mkdir -p b1sc_results/run_${{ github.run_id }} && cp -r out/* pip_freeze.txt b1sc_results/run_${{ github.run_id }}/ || true
          du -sh b1sc_results
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b b1sc-results-${{ github.run_id }}
          git add -f b1sc_results && git commit -qm "B1 splitter check ${{ github.run_id }} (no raw text)"
          git push origin b1sc-results-${{ github.run_id }}
      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
