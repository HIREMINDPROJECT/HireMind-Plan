name: e3-lexsem
concurrency:
  group: e3-lexsem
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [e3-lexsem]
    paths: ['e3/**', '.github/workflows/e3_lexsem.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned HireMind-DL code and data loader
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git _dl && git -C _dl checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Install (CPU torch)
        run: |
          pip install pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 transformers==4.51.3 numpy scipy xgboost sentence-transformers==3.4.1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip freeze > pip_freeze.txt
      - name: E3 lexical vs semantic
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          python e3/e3_lex_vs_sem.py _dl out 2>&1 | tail -25 | cut -c1-200 | tee out/run_log_tail.txt
      - name: Commit outputs (scores/IDs only)
        if: always()
        shell: bash
        run: |
          mkdir -p e3_results/run_${{ github.run_id }} && cp -r out/* pip_freeze.txt e3_results/run_${{ github.run_id }}/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b e3-lexsem-results-${{ github.run_id }}
          git add -f e3_results && git commit -qm "E3 outputs ${{ github.run_id }} (no raw text)"
          git push origin e3-lexsem-results-${{ github.run_id }}
      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
