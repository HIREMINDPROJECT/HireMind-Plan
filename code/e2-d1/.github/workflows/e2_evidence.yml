name: e2-d1
concurrency:
  group: e2-d1
  cancel-in-progress: true
# E2 as defined in the plan: M4 + D1 TRAIN labels + B4 evidence-selected input: M4 + B4 evidence-selected input, 8 matched seeds on CPU. Validation only.
on:
  workflow_dispatch:
  push:
    branches: [e2-d1]
    paths: ['e2/**', '.github/workflows/e2_evidence.yml']
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45, 46, 47, 48, 49]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned HireMind-DL
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git _dl && git -C _dl checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Install (same pins as the A1 reproduction)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.51.3 pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 numpy scipy
          mkdir -p out && pip freeze > out/pip_freeze.txt
      - name: Train seed ${{ matrix.seed }}
        env:
          HIREMIND_MAX_LEN: "512"
          HIREMIND_TRAIN_LABELS: "${{ github.workspace }}/e2/train_labels_v1.csv"
        run: python e2/e2_train_evidence.py --dl _dl --seed ${{ matrix.seed }} --out out 2>&1 | tail -30 | cut -c1-200 | tee out/log_tail_s${{ matrix.seed }}.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2d1-seed-${{ matrix.seed }}
          path: out/
          retention-days: 30
  collect:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2d1-seed-*
          path: collected
      - name: Commit results (scores/IDs only)
        run: |
          mkdir -p e2_results/run_${{ github.run_id }}
          cp -r collected/* e2_results/run_${{ github.run_id }}/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b e2d1-results-${{ github.run_id }}
          git add -f e2_results && git commit -qm "E2 provisional (D0) results ${{ github.run_id }} (no raw text)"
          git push origin e2d1-results-${{ github.run_id }}
