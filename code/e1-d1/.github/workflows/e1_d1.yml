name: e1-d1
# A6/E1: M4 (BERT-Tiny + Knowledge v1) trained on D1 TRAIN labels (train_labels_v1.csv, 255 changes approved by the supervisor), evaluated on the unchanged D0 VALIDATION labels.
# Same pinned code, seeds 42-49, CPU, as A1/E0. Split file untouched. Test set never read.
on:
  push:
    branches: [e1-d1]
    paths: ['e1d1/**', '.github/workflows/e1_d1.yml']
concurrency:
  group: e1-d1
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 43, 44, 45, 46, 47, 48, 49]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned code
        run: |
          git clone -q https://github.com/Hams770/Senior-2.git && git -C Senior-2 checkout -q ec28dfc85e618a737cb192cbf959714cfee89aa5
          git clone -q https://github.com/Hams770/HireMind-DL.git && git -C HireMind-DL checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
          echo "001212500c11a2d471845272718bda0e458968293d551d4979d6331226c178c5  e1d1/train_labels_v1.csv" | sha256sum -c
          python e1d1/patch_train_labels.py Senior-2/evaluation/knowledge/train_knowledge.py
      - name: Install (same pins as A1/E0)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.51.3 pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 numpy
          mkdir -p out/env && pip freeze > out/env/pip_freeze.txt && lscpu > out/env/lscpu.txt && python -V > out/env/python.txt
      - name: Train seed ${{ matrix.seed }} on D1 (CPU)
        env:
          HIREMIND_MAX_LEN: "512"
          HIREMIND_RESULTS: "${{ github.workspace }}/out/results"
          HIREMIND_TRAIN_LABELS: "${{ github.workspace }}/e1d1/train_labels_v1.csv"
        shell: bash
        run: |
          set -o pipefail
          cd Senior-2
          python evaluation/knowledge/train_knowledge.py --dl ../HireMind-DL --seed ${{ matrix.seed }} --variant knowledge_D1 --knowledge 1 --device cpu --save-preds --save-weights ../out/checkpoints 2>&1 | tee ../out/train_log.txt | grep -E "overlay|best|accuracy|Error|Traceback" | tail -5 || true
          grep -q "TRAIN label overlay applied: 255 labels changed" ../out/train_log.txt
      - name: Drop text column from predictions
        shell: bash
        run: |
          python - <<'PY'
          import glob, pandas as pd
          fs = glob.glob('out/results/val_predictions_*.csv'); assert fs, 'no predictions written'
          for f in fs:
              d = pd.read_csv(f); d = d.drop(columns=[c for c in d.columns if c == 'job_title']); d.to_csv(f, index=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e1d1-seed-${{ matrix.seed }}
          path: out/
          retention-days: 90
  collect:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e1d1-seed-*
          path: collected
      - name: Commit results (no weights)
        run: |
          mkdir -p e1d1_results/run_${{ github.run_id }}
          for d in collected/e1d1-seed-*; do
            s=$(basename "$d"); mkdir -p "e1d1_results/run_${{ github.run_id }}/$s"
            (cd "$d" && find . -type f ! -name '*.pt' -print0 | xargs -0 -I{} cp --parents {} "$GITHUB_WORKSPACE/e1d1_results/run_${{ github.run_id }}/$s/")
            (cd "$d" && find . -name '*.pt' -exec sha256sum {} \;) > "e1d1_results/run_${{ github.run_id }}/$s/checkpoint_sha256.txt"
          done
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b e1d1-results-${{ github.run_id }}
          git add -f e1d1_results && git commit -qm "E1/A6 D1 results run ${{ github.run_id }} (no weights)"
          git push origin e1d1-results-${{ github.run_id }}
