name: m8-seeds
# M8 DistilBERT hybrid (E5 ablation), extra seeds 43-45 for all 4 variants. Same protocol as seed 42 (run 45257498571): 512 tokens, CPU, D0, validation only.
on:
  workflow_dispatch:
  push:
    branches: [m8-seeds]
    paths: ['m8/**', '.github/workflows/m8_distilbert.yml']
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [full, minus_evidence, minus_knowledge, minus_struct]
        seed: [43, 44, 45]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned HireMind-DL code and data loader
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git _dl && git -C _dl checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Install (CPU torch)
        run: |
          pip install pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 transformers==4.51.3 numpy scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip freeze > pip_freeze.txt
      - name: M8 DistilBERT ${{ matrix.variant }} (seed ${{ matrix.seed }}, D0, validation only)
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          M8_SEED=${{ matrix.seed }} python m8/m8_distilbert.py _dl out ${{ matrix.variant }} 512 2>&1 | tee out/full_log.txt | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-distilbert-${{ matrix.variant }}-s${{ matrix.seed }}
          path: out/*.pt
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit outputs (scores/IDs only)
        if: always()
        shell: bash
        run: |
          tail -40 out/full_log.txt | cut -c1-200 > out/run_log_tail.txt || true
          rm -f out/full_log.txt out/*.pt
          mkdir -p m8_results/run_${{ github.run_id }}/${{ matrix.variant }}_s${{ matrix.seed }} && cp -r out/* m8_results/run_${{ github.run_id }}/${{ matrix.variant }}_s${{ matrix.seed }}/ || true
          cp pip_freeze.txt m8_results/run_${{ github.run_id }}/${{ matrix.variant }}_s${{ matrix.seed }}/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -b m8-seeds-results-${{ github.run_id }}-${{ matrix.variant }}-s${{ matrix.seed }}
          git add -f m8_results && git commit -qm "M8 ${{ matrix.variant }} seed ${{ matrix.seed }} outputs ${{ github.run_id }} (no raw text)"
          git push origin m8-seeds-results-${{ github.run_id }}-${{ matrix.variant }}-s${{ matrix.seed }}
      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
